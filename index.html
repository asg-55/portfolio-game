<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Game - Pixel 8Bit</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="extended-bg">
    <div id="bg-sky"></div>
    <div id="bg-ground"></div>
  </div>

  <header id="main-nav">
    <div class="logo">Portfolio</div>
    <nav>
      <a href="#game-area">Главная</a>
      <a href="#">Проекты</a>
      <a href="#">Опыт</a>
      <a href="#">Контакты</a>
    </nav>
  </header>

  <div id="game-wrapper">
    <div id="game-area">
      <div id="sky"></div>
      <div id="celestial-body"></div>
      
      <!-- Опущены на 1 человечка (~4vh) -->
      <div id="layer-clouds">
        <div class="cloud" style="left: 12%; top: 28vh;"></div>
        <div class="cloud" style="left: 42%; top: 32vh;"></div>
        <div class="cloud" style="left: 72%; top: 36vh;"></div>
      </div>

      <div id="layer-forest">
        <div class="tree" style="left: 6%;"></div>
        <div class="tree" style="left: 24%; transform: scale(0.8);"></div>
        <div class="tree" style="left: 48%;"></div>
        <div class="tree" style="left: 76%; transform: scale(0.85);"></div>
        <div class="tree" style="left: 92%;"></div>
      </div>

      <div id="world">
        <div id="ground"></div>
        <div id="player"></div>
        <div id="goal"></div>

        <!-- Подняты на 1.5 человечка (~6vh) -->
        <div class="platform" style="left: 10%; top: 69vh; width: 140px; height: 20px;"></div>
        <div class="platform" style="left: 36%; top: 65vh; width: 140px; height: 20px;"></div>
        <div class="platform" style="left: 62%; top: 69vh; width: 140px; height: 20px;"></div>

        <!-- Монетки подняты синхронно с платформами -->
        <div class="coin" style="left: 18%; top: 61vh;" data-text="Привет! Я Александр. Пишу чистый код и создаю быстрые IT-решения."></div>
        <div class="coin" style="left: 44%; top: 57vh;" data-text="Стек: JavaScript, React, Node.js, Git, работа с API и БД."></div>
        <div class="coin" style="left: 70%; top: 61vh;" data-text="Контакты: email@example.com | GitHub | Telegram."></div>
      </div>

      <div id="header-text">Стрелки: движение | Пробел: прыжок<br>Собери монетки и доберись до флага.</div>

      <div id="theme-switch">
        <span>ДЕНЬ</span>
        <label class="pixel-toggle">
          <input type="checkbox" id="theme-toggle">
          <span class="slider"></span>
        </label>
        <span>НОЧЬ</span>
      </div>
      
      <div id="final-screen">
        <div class="final-box">
          <h2>Спасибо, что посетили мой сайт!</h2>
          <p>Связаться со мной можно здесь:</p>
          <div class="social-links">
            <a href="https://github.com/asg-55" target="_blank">GitHub</a> | 
            <a href="#">Telegram</a> | 
            <a href="#">Email</a>
          </div>
          <button id="restart-btn">Играть снова</button>
        </div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
